<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RISK MANAGER</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b0f17;
      color: #ffffff;
      padding: 15px;
      max-width: 500px;
      margin: 0 auto;
    }
    .card {
      background: #151c28;
      border: 1px solid #232d3f;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }
    h2, h3 {
      color: #00e676;
      margin-bottom: 12px;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    label {
      font-size: 0.8rem;
      color: #8b9bb4;
      margin-bottom: 4px;
      display: block;
    }
    input, select {
      width: 100%;
      padding: 10px;
      background: #0b0f17;
      border: 1px solid #232d3f;
      color: #fff;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-buy { background: #00b0ff; color: #fff; }
    .btn-sell { background: #ff5252; color: #fff; }
    .btn-calc { background: linear-gradient(90deg, #00e676, #00b0ff); color: #000; font-size: 1rem; margin-top: 5px; }
    .btn-add { background: #232d3f; color: #00e676; padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; }
    .res-box {
      background: #0b0f17;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #1a2332;
    }
    .res-val {
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 4px;
    }
    .val-green { color: #00e676; }
    .val-red { color: #ff5252; }
    .val-blue { color: #00b0ff; }
    .nav-tabs {
      display: flex;
      justify-content: space-around;
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      background: #151c28;
      border-top: 1px solid #232d3f;
      padding: 10px 0;
    }
    .tab-btn {
      background: none;
      border: none;
      color: #8b9bb4;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .tab-btn.active { color: #00e676; font-weight: bold; }
    .page { display: none; padding-bottom: 60px; }
    .page.active { display: block; }
  </style>
</head>
<body>

  <!-- DASHBOARD PAGE -->
  <div id="page-dashboard" class="page">
    <div class="card">
      <h3>
        📂 Accounts Dashboard 
        <button class="btn-add" onclick="addNewAccount()">+ Add Account</button>
      </h3>
      <label>Select Active Account</label>
      <select id="accSelect" onchange="switchAccount()"></select>

      <div class="grid-2">
        <div>
          <label>Account Size ($)</label>
          <input type="number" id="accSize" oninput="updateAccountData()">
        </div>
        <div>
          <label>Current Equity ($)</label>
          <input type="number" id="accEquity" oninput="updateAccountData()">
        </div>
      </div>

      <div class="grid-2" style="margin-top: 10px;">
        <div class="res-box">
          <label>Profit / Loss</label>
          <div id="pnlVal" class="res-val">$0.00</div>
        </div>
        <div class="res-box">
          <label>Drawdown %</label>
          <div id="ddVal" class="res-val">0.00%</div>
        </div>
      </div>
    </div>
  </div>

  <!-- CALCULATOR PAGE -->
  <div id="page-calc" class="page active">
    <div class="card">
      <h3>🧮 Risk Calculator</h3>
      
      <div class="grid-2">
        <div>
          <label>Instrument</label>
          <select id="instrument" onchange="calculate()">
            <option value="XAUUSD">XAUUSD (Gold)</option>
            <option value="BTCUSD">BTCUSD</option>
            <option value="EURUSD">EURUSD</option>
            <option value="GBPUSD">GBPUSD</option>
          </select>
        </div>
        <div>
          <label>Direction</label>
          <div class="grid-2">
            <button class="btn btn-buy" id="btnBuy" onclick="setDir('BUY')">BUY</button>
            <button class="btn btn-sell" id="btnSell" style="opacity: 0.4;" onclick="setDir('SELL')">SELL</button>
          </div>
        </div>
      </div>

      <div class="grid-3">
        <div>
          <label>Entry Price</label>
          <input type="number" id="entryPrice" value="2400.00" oninput="calculate()">
        </div>
        <div>
          <label>Stop Loss ($)</label>
          <input type="number" id="slAmount" value="500" oninput="calculate()">
        </div>
        <div>
          <label>Target Profit ($)</label>
          <input type="number" id="tpAmount" value="1500" oninput="calculate()">
        </div>
      </div>

      <div>
        <label>Stop Loss Distance (Points/Pips)</label>
        <input type="number" id="slPoints" value="100" oninput="calculate()">
      </div>

      <button class="btn btn-calc" onclick="calculate()">CALCULATE 🚀</button>
    </div>

    <!-- RESULTS CARD -->
    <div class="card">
      <h3>🎯 Calculation Results</h3>
      <div class="grid-3">
        <div class="res-box">
          <label>Risk Amount</label>
          <div id="resRiskUSD" class="res-val val-red">$500.00</div>
        </div>
        <div class="res-box">
          <label>Risk %</label>
          <div id="resRiskPct" class="res-val">0.50%</div>
        </div>
        <div class="res-box">
          <label>Lot Size</label>
          <div id="resLot" class="res-val val-green">0.50</div>
        </div>
      </div>

      <div class="grid-3" style="margin-top: 10px;">
        <div class="res-box">
          <label>SL Price</label>
          <div id="resSLPrice" class="res-val">2390.00</div>
        </div>
        <div class="res-box">
          <label>TP Price</label>
          <div id="resTPPrice" class="res-val">2430.00</div>
        </div>
        <div class="res-box">
          <label>Risk : Reward</label>
          <div id="resRR" class="res-val val-blue">1 : 3.00</div>
        </div>
      </div>
    </div>
  </div>

  <!-- NAVIGATION TABS -->
  <div class="nav-tabs">
    <button class="tab-btn" onclick="showPage('dashboard')">📊 Dashboard</button>
    <button class="tab-btn active" onclick="showPage('calc')">🧮 Calculator</button>
  </div>

  <script>
    let tradeDir = 'BUY';
    let accounts = JSON.parse(localStorage.getItem('user_accounts')) || [
      { name: "Prop Account 1", size: 100000, equity: 100000 }
    ];
    let activeAccIdx = 0;

    function init() {
      renderAccountDropdown();
      loadAccountToInput();
      calculate();
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('page-' + pageId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    function renderAccountDropdown() {
      const select = document.getElementById('accSelect');
      select.innerHTML = '';
      accounts.forEach((acc, i) => {
        select.innerHTML += `<option value="${i}">${acc.name}</option>`;
      });
      select.value = activeAccIdx;
    }

    function switchAccount() {
      activeAccIdx = document.getElementById('accSelect').value;
      loadAccountToInput();
      calculate();
    }

    function loadAccountToInput() {
      const current = accounts[activeAccIdx];
      document.getElementById('accSize').value = current.size;
      document.getElementById('accEquity').value = current.equity;
      updateAccountData();
    }

    function updateAccountData() {
      const size = parseFloat(document.getElementById('accSize').value) || 0;
      const equity = parseFloat(document.getElementById('accEquity').value) || 0;
      
      accounts[activeAccIdx].size = size;
      accounts[activeAccIdx].equity = equity;
      localStorage.setItem('user_accounts', JSON.stringify(accounts));

      const pnl = equity - size;
      const dd = size > 0 ? ((equity - size) / size) * 100 : 0;

      const pnlEl = document.getElementById('pnlVal');
      pnlEl.innerText = (pnl >= 0 ? '+$' : '-$') + Math.abs(pnl).toFixed(2);
      pnlEl.className = 'res-val ' + (pnl >= 0 ? 'val-green' : 'val-red');

      const ddEl = document.getElementById('ddVal');
      ddEl.innerText = dd.toFixed(2) + '%';
      ddEl.className = 'res-val ' + (dd >= 0 ? 'val-green' : 'val-red');

      calculate();
    }

    function addNewAccount() {
      const name = prompt("Enter Account Name (e.g. FTMO 50k):");
      if (name) {
        accounts.push({ name: name, size: 50000, equity: 50000 });
        activeAccIdx = accounts.length - 1;
        renderAccountDropdown();
        loadAccountToInput();
      }
    }

    function setDir(dir) {
      tradeDir = dir;
      document.getElementById('btnBuy').style.opacity = dir === 'BUY' ? '1' : '0.4';
      document.getElementById('btnSell').style.opacity = dir === 'SELL' ? '1' : '0.4';
      calculate();
    }

    function calculate() {
      const slAmount = parseFloat(document.getElementById('slAmount').value) || 0;
      const tpAmount = parseFloat(document.getElementById('tpAmount').value) || 0;
      const entryPrice = parseFloat(document.getElementById('entryPrice').value) || 0;
      const slPoints = parseFloat(document.getElementById('slPoints').value) || 1;
      const equity = parseFloat(document.getElementById('accEquity').value) || 100000;

      // Calculate Dynamic Risk : Reward Ratio
      const rrRatio = slAmount > 0 ? (tpAmount / slAmount).toFixed(2) : "0.00";
      document.getElementById('resRR').innerText = `1 : ${rrRatio}`;

      // Calculate Risk % from Current Equity
      const riskPct = ((slAmount / equity) * 100).toFixed(2);
      document.getElementById('resRiskPct').innerText = `${riskPct}%`;

      // Calculate SL & TP Prices
      let slPrice = 0, tpPrice = 0;
      const pointValue = slPoints * 0.1; // Standard adjustment for points

      if (tradeDir === 'BUY') {
        slPrice = entryPrice - pointValue;
        tpPrice = entryPrice + (pointValue * (tpAmount / (slAmount || 1)));
      } else {
        slPrice = entryPrice + pointValue;
        tpPrice = entryPrice - (pointValue * (tpAmount / (slAmount || 1)));
      }

      // Calculate Lot Size (Simplified)
      const lotSize = (slAmount / (slPoints * 10)).toFixed(2);

      document.getElementById('resRiskUSD').innerText = `$${slAmount.toFixed(2)}`;
      document.getElementById('resLot').innerText = lotSize > 0 ? lotSize : "0.01";
      document.getElementById('resSLPrice').innerText = slPrice.toFixed(2);
      document.getElementById('resTPPrice').innerText = tpPrice.toFixed(2);
    }

    init();
  </script>
</body>
</html>
